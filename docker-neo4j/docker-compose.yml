services:
  neo4j:
    image: neo4j:5.25.1-community
    container_name: docker-neo4j-1
    ports: 
      - 7888:7474
      - 7999:7687
    restart: unless-stopped
    environment: 
      - NEO4J_AUTH=neo4j/password
    volumes:
      - ./db/data:/data
      - ./db/conf:/conf
      - ./db/logs:/logs
      - ./db/plugins:/plugins
      - ./import:/import
      - ./scripts:/scripts
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p password 'RETURN 1' || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 5

  neo4j-populate:
    image: neo4j:5.25.1-community
    container_name: docker-neo4j-populate
    depends_on:
      neo4j:
        condition: service_healthy
    volumes:
      - ./scripts:/scripts
      - ./import:/import
    entrypoint: ["/bin/bash", "-c", "/scripts/populate_nyc/populate.sh"]
    restart: "no"

  backend:
    build: ./backend
    container_name: docker-neo4j-backend
    ports:
      - 8000:8000
    restart: unless-stopped
    depends_on:
      neo4j-populate:
        condition: service_completed_successfully
    environment:
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=password
    volumes:
      - ./backend:/backend